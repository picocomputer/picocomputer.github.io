<text class="file" x="215.5" y="236">build/cc65/debug/hello.rp6502</text>
<text class="note" x="215.5" y="253">one build folder for each preset</text>
<path class="line" d="M350 262.5V293.5"/>
<path class="line" d="M111 293.5V284.5Q111 278.5 117 278.5H583Q589 278.5 589 284.5V293.5"/>
<path class="tip" d="M106 292.5L111 300L116 292.5Z"/>
<path class="tip" d="M345 292.5L350 300L355 292.5Z"/>
<path class="tip" d="M584 292.5L589 300L594 292.5Z"/>
<rect class="box" x="0.5" y="300.5" width="221" height="102" rx="6"/>
<text class="name" x="16" y="326">RP6502-EMU</text>
<text class="file" x="16" y="350">tools/rp6502-emu</text>
<text x="16" y="368">the emulator, with</text>
<text x="16" y="386">breakpoints and stepping</text>
<rect class="box" x="239.5" y="300.5" width="221" height="102" rx="6"/>
<text class="name" x="255" y="326">RP6502-PICO</text>
<text class="strong" x="255" y="350">a standalone machine,</text>
<text x="255" y="368">over USB serial</text>
<text x="255" y="386">or telnet</text>
<rect class="box" x="478.5" y="300.5" width="221" height="102" rx="6"/>
<text class="name" x="494" y="326">RP6502-WEB</text>
<text class="file" x="494" y="350">web/hello.zip</text>
<text x="494" y="368">from <tspan class="mono">rp6502_web()</tspan>,</text>
