<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="762" height="516" viewBox="0 0 762 516" role="img" aria-labelledby="title desc" font-size="13" fill="currentColor">
<title id="title">The planes of the canvas</title>
<desc id="desc">The VGA system draws the canvas from three planes, each with a fill layer and a sprite layer. Plane 0 is at the back and plane 2 is at the front. The six layers make the canvas, and the status bar of plane 2 covers part of the sun, a sprite of plane 0.</desc>
<style>
  svg { color: #cfd0d0; }
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
</style>
<defs>
